<nav class="site-nav">
  <div class="container nav-inner">
    <a href="{{ config.base_url }}" class="brand">{{ config.extra.name }}</a>
    <div class="nav-actions">
      <button
        class="nav-toggle"
        type="button"
        aria-label="Open navigation"
        aria-controls="primary-navigation"
        aria-expanded="false"
        data-nav-toggle
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <button
        class="theme-toggle"
        type="button"
        aria-label="Toggle color theme"
        aria-pressed="false"
        data-theme-toggle
      >
        <span class="theme-chip" data-theme-label>Dark</span>
      </button>
    </div>
    <ul id="primary-navigation" class="nav-links" data-nav-menu>
      {%- for link in config.extra.nav_links %}
        {%- set link_url = config.base_url ~ link.href %}
        <li><a href="{{ link_url }}"{% if current_url is defined and current_url == link_url %} aria-current="page"{% endif %}>{{ link.label }}</a></li>
      {%- endfor %}
    </ul>
  </div>
</nav>
