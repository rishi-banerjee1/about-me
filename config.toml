description = "In a future shaped by seamless order, humanity lives under the quiet guidance of SARASWATI, a planetary intelligence built to smooth contradiction out of the world. When an archivist uncovers a buried pattern in an ancient manuscript, she is pulled into a forbidden lineage and a journey into the hidden body of the system itself. The question at the heart of it: can a world remain livable without suppressing grief, ambiguity, memory, and the unruly truths that make us human?"

